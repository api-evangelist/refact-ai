apis:
  - aid: refact-ai:refact-engine-api
    name: Refact Agent Engine API
    description: >-
      Local HTTP/LSP API exposed by the Rust `refact-lsp` engine that runs
      inside the user's IDE or as a standalone server. Implements the agent
      runtime: provider/model capabilities, chat command queueing, SSE
      event streams, code completion, tool registry and confirmation rules,
      AST indexing, RAG/vector search over the workspace, integrations
      configuration, knowledge graph operations, task board management,
      and workspace checkpoint/rollback. This is the contract the VS Code
      and JetBrains plugins and the GUI call over `http://127.0.0.1:<port>/v1`.
    humanURL: https://docs.refact.ai
    tags:
      - AI
      - Agent
      - LSP
      - HTTP
      - Local
    properties:
      - url: https://docs.refact.ai
        type: Documentation
      - url: https://github.com/smallcloudai/refact/tree/main/refact-agent/engine
        type: SourceCode
      - url: https://github.com/smallcloudai/refact
        type: GitHubRepository
  - aid: refact-ai:refact-mcp-integration
    name: Refact MCP Integration
    description: >-
      Refact Agent acts as an MCP (Model Context Protocol) client, attaching
      local or remote MCP servers (`npx`, Python `-m`, `docker run`, or
      remote SSE) into the agent's tool surface with per-tool confirmation
      rules. This makes any MCP server an extension of the Refact Agent's
      capability set inside the IDE.
    humanURL: https://docs.refact.ai/features/autonomous-agent/integrations/mcp/
    tags:
      - MCP
      - Model Context Protocol
      - Agent
      - Integrations
    properties:
      - url: https://docs.refact.ai/features/autonomous-agent/integrations/mcp/
        type: Documentation
      - url: https://github.com/modelcontextprotocol
        type: Standard
