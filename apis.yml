aid: refact-ai
name: Refact.ai
description: >-
  Refact.ai is an open-source, local-first AI coding assistant and autonomous
  software-engineering agent built by Small Magellanic Cloud Ai Ltd.
  ("SmallCloud"). The product combines an IDE-integrated chat experience
  (Ask / Explore / Debug / Review / Plan modes), accurate code completion
  powered by Qwen2.5-Coder with RAG over the workspace, and the Refact Agent
  — an autonomous mode that plans, executes, and iterates on engineering
  tasks end-to-end, integrating with Git hosts, databases, shells, browsers,
  and MCP servers. The full agent stack — a Rust HTTP/LSP engine
  (`refact-lsp`), a React/Vite chat GUI, and VS Code + JetBrains plugins —
  is open source under BSD-3-Clause at github.com/smallcloudai/refact and
  ranked #1 open-source agent on SWE-bench Lite (60.0%) and 93.3% on Aider's
  Polyglot benchmark with thinking mode. Refact supports a cloud SaaS tier
  (Free / Pro / Enterprise) — though Refact Cloud is being wound down in
  favor of BYOK + self-hosting — plus enterprise on-premise deployment with
  LLM fine-tuning, AWS Marketplace listings, and bring-your-own-key access
  to Anthropic, OpenAI, Google, xAI, DeepSeek, Groq, Ollama, LM Studio,
  vLLM, GitHub Copilot, and any OpenAI-compatible endpoint. Refact is
  positioned as a privacy-preserving, self-hostable alternative to closed
  cloud coding agents — workspace context, checkpoints, knowledge graphs,
  and trajectories are stored locally; no code is sent to the vendor's
  servers in self-hosted mode.
